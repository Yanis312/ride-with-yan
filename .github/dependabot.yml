# Dependabot ouvre une pull request quand une dépendance a une mise à jour
# ou une faille connue. On relit, les tests tournent, on fusionne seulement
# si tout est vert. Les failles de sécurité passent même pour une version
# majeure (alertes de sécurité de GitHub).
version: 2
updates:
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      outils-de-test:
        patterns: ['*']
        # Les petites mises à jour arrivent ensemble ; une version majeure
        # (TypeScript 7, ESLint 10…) casse souvent le code : on la fait à la
        # main, dans sa propre pull request.
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
