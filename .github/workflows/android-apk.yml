name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Signé avec la clé de debug (template Flutter par défaut) : installable directement
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ride-with-yan.apk
      # Release "apk-latest" recréée à chaque push : lien de téléchargement fixe
      - name: Publish to apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest ride-with-yan.apk \
            --prerelease \
            --title "APK de test (dernier build)" \
            --notes "Build automatique du commit ${GITHUB_SHA::7}. Télécharger sur l'appareil Android, puis autoriser l'installation depuis cette source."
