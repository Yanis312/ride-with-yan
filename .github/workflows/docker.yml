name: Docker

# Vérifie que tout tourne dans Docker (docker compose) : construction de
# l'app avec Flutter, serveur nginx et tests Playwright. Aucun outil installé
# sur la machine à part Docker.

on:
  pull_request:
    paths: ['e2e/**', 'app/Dockerfile', 'app/nginx.conf', 'docker-compose.yml', '.github/workflows/docker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Tests dans Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Tests Playwright dans les conteneurs
        run: docker compose run --rm e2e
      - name: Rapport des tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-playwright-report
          path: e2e/playwright-report
          retention-days: 14
