server {
  listen 80;
  root /usr/share/nginx/html;

  # Flutter web charge des modules .mjs : nginx ne connaît pas cette
  # extension, on lui donne le bon type (sinon le navigateur les refuse).
  location ~ \.mjs$ {
    default_type text/javascript;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
