name: ride_with_yan
description: "Ride with Yan : application tablette bilingue pour les passagers."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  intl: ^0.20.3
  liquid_glass_widgets: ^1.8.1
  video_player: ^2.14.0
  qr_flutter: ^4.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  youtube_player_iframe: ^6.0.2
  http: ^1.6.0
  xml: ^7.1.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/showcase/
    - assets/photos/
    - assets/products/

  shaders:
    - shaders/mesh.frag
    - shaders/liquid_metal.frag

  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/cormorant-garamond-500-normal.ttf
          weight: 500
        - asset: assets/fonts/cormorant-garamond-600-normal.ttf
          weight: 600
        - asset: assets/fonts/cormorant-garamond-500-italic.ttf
          weight: 500
          style: italic
    - family: Jakarta
      fonts:
        - asset: assets/fonts/plus-jakarta-sans-300-normal.ttf
          weight: 300
        - asset: assets/fonts/plus-jakarta-sans-400-normal.ttf
          weight: 400
        - asset: assets/fonts/plus-jakarta-sans-500-normal.ttf
          weight: 500
        - asset: assets/fonts/plus-jakarta-sans-600-normal.ttf
          weight: 600
    - family: PhosphorLight
      fonts:
        - asset: assets/fonts/phosphor-light.ttf
