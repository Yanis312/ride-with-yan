# Build de l'APK Android dans le cloud à chaque push sur main.
# Prérequis : webhook GitHub -> https://api.codemagic.io/hooks/<appId>
# L'aperçu web est géré par GitHub Actions (.github/workflows/web-preview.yml).

definitions:
  triggering: &push_main
    events:
      - push
    branch_patterns:
      - pattern: main
        include: true
    cancel_previous_builds: true

workflows:
  android-apk:
    name: Android APK (test install)
    max_build_duration: 30
    instance_type: linux_x2
    working_directory: app
    triggering: *push_main
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android APK (debug, installable)
        script: flutter build apk --debug
    artifacts:
      # Glob valable que le chemin soit résolu depuis la racine du dépôt ou depuis app/
      - "**/build/app/outputs/flutter-apk/*.apk"
    publishing:
      email:
        recipients:
          - yanisgaroui1@gmail.com
        notify:
          success: true
          failure: true
