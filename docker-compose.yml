# Tout le projet dans des conteneurs : il suffit de Git et de Docker.
#
#   docker compose run --rm e2e
#
# 1. « web » construit l'app avec Flutter puis la sert avec nginx ;
# 2. « e2e » lance les tests Playwright contre elle.
# Le rapport HTML arrive dans e2e/playwright-report.
services:
  web:
    build: ./app
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 2s
      retries: 30

  e2e:
    build: ./e2e
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_URL: http://web/
    volumes:
      - ./e2e/playwright-report:/e2e/playwright-report
