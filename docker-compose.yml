# Lance l'app web construite et la suite de tests dans des conteneurs :
# le même résultat sur n'importe quelle machine, sans rien installer.
#
#   cd app && flutter build web --release --wasm && cd ..
#   docker compose run --rm e2e
#
# Le rapport HTML arrive dans e2e/playwright-report.
services:
  web:
    image: node:22-alpine
    working_dir: /srv
    volumes:
      - ./e2e/serve.mjs:/srv/serve.mjs:ro
      - ./app/build/web:/srv/web:ro
    command: node serve.mjs web 8080
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/']
      interval: 2s
      retries: 30

  e2e:
    build: ./e2e
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_URL: http://web:8080/
    volumes:
      - ./e2e/playwright-report:/e2e/playwright-report
