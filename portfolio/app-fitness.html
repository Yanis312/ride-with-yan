<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride · App démo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Sora, sans-serif; background:#0a0c10; color:#f2f4f8; padding:56px 20px 30px; min-height:100vh; }
  small { color:#8a93a6; }
  h1 { font-size:34px; line-height:1.05; letter-spacing:-.03em; margin:8px 0 24px; }
  .ring { width:230px; height:230px; margin:0 auto 24px; border-radius:50%; display:grid; place-items:center;
          background:conic-gradient(#5b8cff 0 72%, #1a1f2b 72% 100%); position:relative; }
  .ring::before { content:""; position:absolute; inset:16px; border-radius:50%; background:conic-gradient(#3ee6b4 0 58%, #1a1f2b 58% 100%); }
  .ring::after { content:""; position:absolute; inset:32px; border-radius:50%; background:#0a0c10; }
  .ring div { position:relative; z-index:1; text-align:center; } .ring b { font-size:44px; display:block; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat { background:#131722; border-radius:22px; padding:18px; } .stat b { font-size:26px; display:block; margin-top:6px; }
  .week { display:flex; align-items:end; gap:8px; height:110px; background:#131722; border-radius:22px; padding:16px; margin-top:12px; }
  .week i { flex:1; border-radius:8px; background:#232a3a; } .week i.on { background:linear-gradient(180deg,#5b8cff,#3ee6b4); }
  .go { margin-top:16px; text-align:center; background:linear-gradient(90deg,#5b8cff,#3ee6b4); color:#0a0c10; font-weight:700; border-radius:20px; padding:18px; }
</style>
</head>
<body>
<small>Mercredi · Semaine 3</small>
<h1>Belle série, Yanis.<br>Encore 2 400 pas.</h1>
<div class="ring"><div><b>7 600</b><small>pas aujourd'hui</small></div></div>
<div class="stats"><div class="stat"><small>Calories</small><b>512</b></div><div class="stat"><small>Sommeil</small><b>7 h 40</b></div></div>
<div class="week"><i style="height:40%"></i><i style="height:65%"></i><i style="height:52%"></i><i class="on" style="height:90%"></i><i style="height:30%"></i><i style="height:20%"></i><i style="height:15%"></i></div>
<div class="go">Démarrer une séance</div>
</body>
</html>
