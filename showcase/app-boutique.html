<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumière · App boutique</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0} body{font-family:"Inter Tight";background:#0d0c0b;color:#f1ebe2;padding:54px 20px 110px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center} .top b{font-family:"Cormorant Garamond";font-size:28px}
.ic{width:42px;height:42px;border-radius:50%;background:#1a1816;border:1px solid #2a2622;display:grid;place-items:center}
h1{font-family:"Cormorant Garamond";font-weight:500;font-size:40px;line-height:1;margin:22px 0 16px}
.chips{display:flex;gap:8px;margin-bottom:18px} .chips span{padding:9px 15px;border-radius:999px;background:#1a1816;font-size:13px;color:#a39a8f} .chips .on{background:#c9a36a;color:#0d0c0b;font-weight:600}
.hero{height:300px;border-radius:26px;background:linear-gradient(transparent 45%,rgba(0,0,0,.85)),url(img/FB82X2VFWT.jpg) center/cover;padding:20px;display:flex;flex-direction:column;justify-content:end}
.hero small{color:#c9a36a;letter-spacing:.15em;font-size:11px} .hero b{font-family:"Cormorant Garamond";font-size:30px;font-weight:500} .hero span{color:#c9a36a;font-size:20px}
.row{display:flex;gap:12px;margin-top:16px} .card{flex:1;background:#171513;border:1px solid #2a2622;border-radius:20px;padding:8px}
.card i{display:block;height:120px;border-radius:14px;background-size:cover;background-position:center} .card p{font-size:13px;margin:10px 4px 2px} .card span{color:#c9a36a;font-size:13px;margin-left:4px}
.bar{position:fixed;left:20px;right:20px;bottom:22px;display:flex;gap:10px} .bar div{flex:1;padding:17px;border-radius:18px;text-align:center;font-weight:600}
.gold{background:linear-gradient(135deg,#e2c08a,#b8894b);color:#0d0c0b} .ghost{border:1px solid #3a342e}
</style></head><body>
<div class="top"><b>Lumière</b><div class="ic">♡</div></div>
<h1>Nouveautés de la saison</h1>
<div class="chips"><span class="on">Vestes</span><span>Manteaux</span><span>Accessoires</span></div>
<div class="hero"><small>NOUVEAUTÉ</small><b>Blouson cuir et écharpe</b><span>629 $</span></div>
<div class="row"><div class="card"><i style="background-image:url(img/G53WADMPZJ.jpg)"></i><p>Veste croisée</p><span>489 $</span></div><div class="card"><i style="background-image:url(img/72V88M4FAC.jpg)"></i><p>Le vestiaire</p><span>300+ pièces</span></div></div>
<div class="bar"><div class="gold">Ajouter au panier</div><div class="ghost">Essayer</div></div>
</body></html>
