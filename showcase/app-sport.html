<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLT Run · App sport</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0} body{font-family:Inter;background:#070807;color:#f2f5ef;padding:54px 20px 30px;min-height:100vh}
small{color:#8d948a} h1{font-family:Unbounded;font-size:30px;line-height:1.05;margin:6px 0 22px} h1 span{color:#d4ff3a}
.ring{width:230px;height:230px;margin:0 auto 22px;border-radius:50%;background:conic-gradient(#d4ff3a 0 74%,#1a1d18 74% 100%);display:grid;place-items:center;box-shadow:0 0 60px rgba(212,255,58,.2)}
.ring div{width:196px;height:196px;border-radius:50%;background:#070807;display:grid;place-items:center;text-align:center} .ring b{font-family:Unbounded;font-size:40px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} .s{background:#111311;border:1px solid #1f231e;border-radius:20px;padding:16px} .s b{font-family:Unbounded;font-size:22px;display:block;margin-top:6px}
.run{margin-top:12px;height:150px;border-radius:22px;background:linear-gradient(90deg,rgba(7,8,7,.9) 35%,transparent),url(img/SSO1M7IJTN.jpg) center/cover;padding:18px;display:flex;flex-direction:column;justify-content:center}
.run b{font-family:Unbounded;font-size:18px} .go{margin-top:14px;background:#d4ff3a;color:#070807;text-align:center;padding:17px;border-radius:999px;font-weight:600}
</style></head><body>
<small>Jeudi · Semaine 6</small>
<h1>Plus que <span>2,4 km</span> pour ton objectif.</h1>
<div class="ring"><div><span><b>7,6</b><small>km cette semaine</small></span></div></div>
<div class="grid"><div class="s"><small>Allure</small><b>5'12"</b></div><div class="s"><small>Calories</small><b>612</b></div></div>
<div class="run"><small>Ce soir, 19 h</small><b>Club de course du jeudi</b></div>
<div class="go">Démarrer une course</div>
</body></html>
